name: huntr-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
        VITE_BASE_URL_IMAGE: ${VITE_BASE_URL_IMAGE}
        VITE_DEBUG_GR_DATE: ${VITE_DEBUG_GR_DATE:-false}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY}
        VITE_WEATHER_API_KEY: ${VITE_WEATHER_API_KEY}
        VITE_CURRENCY_API_KEY: ${VITE_CURRENCY_API_KEY}
    container_name: huntr_frontend_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"

  web:
    image: nginx:1.27-alpine
    container_name: huntr_frontend_web
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "5173:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
